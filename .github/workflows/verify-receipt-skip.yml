name: Verify release receipt skip

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipt-skip:
    name: Verify receipt-skip contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main HEAD
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fail-safe receipt behavior and workflow wiring
        run: pnpm exec vitest run test/ci/release-receipt-skip.test.ts
