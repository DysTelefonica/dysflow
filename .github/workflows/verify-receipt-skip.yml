name: Verify release receipt skip

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipt-skip:
    name: Verify receipt-skip contract
    # Linux receipt-skip contract verification.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main HEAD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise the exact direct-gate sequence from a clean scheduled checkout.
      # The receipt test pins this list and its order against release.yml.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test with coverage
        run: pnpm coverage
