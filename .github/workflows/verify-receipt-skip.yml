name: Verify release receipt skip

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-receipt-skip:
    name: Verify receipt-skip contract
    # Linux receipt-skip contract verification.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main HEAD
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exercise the exact direct-gate sequence from a clean scheduled checkout.
      # The receipt test pins this list and its order against release.yml.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test with coverage
        run: pnpm coverage
