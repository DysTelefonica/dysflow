name: Documentation quality
on:
  pull_request:
jobs:
  documentation-quality:
    # Skill catalog propagation PRs use `skill-fleet/*` head branches and copy
    # markdown whose style is governed by the team-skills catalog, not by this
    # consumer's documentation rules (#1763). Skip the gate for those PRs so
    # the catalog stays the single source of truth for skill markdown.
    # The `startsWith()` expression keeps the exemption specific to the bot
    # branch prefix and rejects `feat/skill-fleet-x` style human branches.
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.head.ref, 'skill-fleet/')
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: node scripts/check-documentation-quality.mjs classify --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"
      - name: Check changed documentation
        if: steps.classify.outputs.docs_changed == 'true'
        run: node scripts/check-documentation-quality.mjs check --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
