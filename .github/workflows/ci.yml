name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

# A superseded pull-request run proves nothing: the commit it validated will
# never be merged. Cancelling it frees a Windows runner (billed at 2x) that
# would otherwise finish a ~13-minute gate nobody reads. Pushes to main are
# NOT cancelled — scripts/release-prepare.ps1 polls the CI conclusion for one
# specific release SHA and refuses to tag on anything but `success`, so a
# cancelled main run would abort a legitimate release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code_required: ${{ steps.classify.outputs.code_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/check-documentation-quality.mjs classify --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  # A pull_request run checks GitHub's synthetic merge ref, not merely the
  # branch head. When the eventual main commit identifies that same base/head
  # pair and the PR's CI run is green, repeating the full Windows suite proves
  # the same tree twice. Keep one cheap exact-main-SHA signal for releases,
  # dependency freshness, and merge provenance instead.
  #
  # No branch protection or ruleset currently guards main (#1571), so every
  # direct, ambiguous, or API-unverifiable push falls back to the full quality
  # job below. An unavailable API saves no work; it never weakens the gate.
  main-integrity:
    name: Main integrity
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      validated_pr_merge: ${{ steps.provenance.outputs.validated_pr_merge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: provenance
        name: Verify merged PR already passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "validated_pr_merge=false" >> "$GITHUB_OUTPUT"

          if ! commit_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")"; then
            echo "GitHub commit lookup unavailable; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t parents < <(jq -r '.parents[].sha' <<< "$commit_json")
          if test "${#parents[@]}" -ne 2; then
            echo "Direct or non-two-parent push; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! prs_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"; then
            echo "GitHub PR lookup unavailable; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          candidate="$(jq -c \
            --arg merge "$GITHUB_SHA" \
            --arg base "${parents[0]}" \
            --arg head "${parents[1]}" \
            '[.[] | select(
              .merged_at != null and
              .merge_commit_sha == $merge and
              .base.ref == "main" and
              .base.sha == $base and
              .head.sha == $head
            )] | if length == 1 then .[0] else empty end' <<< "$prs_json")"
          if test -z "$candidate"; then
            echo "No unique PR matches the merge/base/head identities; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          head_sha="$(jq -r '.head.sha' <<< "$candidate")"
          pr_number="$(jq -r '.number' <<< "$candidate")"
          if ! runs_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f head_sha="$head_sha" -f status=completed -f per_page=100)"; then
            echo "GitHub Actions lookup unavailable; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="$(jq -c --arg head "$head_sha" \
            '[.workflow_runs[] | select(
              .name == "CI" and
              .event == "pull_request" and
              .head_sha == $head
            )] | sort_by(.created_at) | reverse | first // empty' <<< "$runs_json")"
          if test -z "$latest" || test "$(jq -r '.conclusion' <<< "$latest")" != success; then
            echo "PR #$pr_number has no latest successful CI run; full quality is required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "validated_pr_merge=true" >> "$GITHUB_OUTPUT"
          echo "PR #$pr_number already proved this merge's base/head pair; full quality will not repeat." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Audit dependencies
        env:
          AUDIT_SOURCE: https://registry.npmjs.org
          AUDIT_UNAVAILABLE_POLICY: fail
        run: node scripts/dependency-audit-evidence.mjs

  quality:
    name: Quality gates
    needs: [changes, main-integrity]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (
        (github.event_name == 'pull_request' && needs.changes.outputs.code_required == 'true') ||
        (github.event_name == 'push' && needs.main-integrity.outputs.validated_pr_merge != 'true')
      )
    runs-on: windows-latest
    # One leg, because `engines.node` now claims one major. The two-leg matrix
    # existed to prove the floor and ceiling of a `>=20 <27` range. With the
    # range narrowed to Node 26, the second leg repeated deterministic work for
    # no extra signal (#1506).
    #
    # test/quality-gates/ci-workflow.test.ts derives this list from
    # engines.node, so widening support forces the matrix to widen with it.
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build once, and before anything reads `dist/`.
      #
      # The build used to run twice per leg: the root `prepare` lifecycle during
      # `pnpm install`, then this step (#1506 shows `tsc` at log lines 208 and
      # 984 of run 32597834437). `prepare` is the half that was removed, not
      # this step: pnpm skips lifecycle scripts when an install is a no-op, so
      # relying on it means the build can silently not happen — and
      # release-bundled-skills-1349 then fails with a bare ENOENT from its
      # unguarded `access(dist/cli/index.js)`. An explicit step ordered ahead of
      # its consumers cannot skip.
      - name: Build
        run: pnpm build

      # `pnpm coverage` is `vitest run --coverage`: the same suite `pnpm test`
      # runs, plus instrumentation and thresholds. Keep only the superset so
      # the suite runs exactly once per pull request (#1506).
      - name: Test with coverage
        run: pnpm coverage

      - name: Public test suite (#979)
        run: pnpm test:public

      - name: MCP context budget (shrink-only)
        run: pnpm mcp:context-budget

  windows-integration-smoke:
    name: Windows PowerShell/Access smoke
    needs: changes
    # The PR proves these integration paths before merge. The main-push
    # integrity receipt remains the exact-SHA authority used by releases.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows PowerShell host
        shell: pwsh
        run: |
          Get-Command powershell.exe
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      # One explicit build, same reasoning as the quality job: the Pester and
      # Access steps below load the compiled core bridge, and `prepare` is no
      # longer there to build it implicitly (#1506).
      - name: Build TypeScript core bridge
        run: pnpm build

      - name: Run PowerShell Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -Scope CurrentUser
          }
          Import-Module Pester
          $result = Invoke-Pester -Path scripts/tests -PassThru -Output Minimal
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run Access/PowerShell integration tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-access-smoke-vitest.json"
          pnpm vitest run --config vitest.integration.config.ts --reporter=default --reporter=json --outputFile=$report `
            test/e2e/access-fixture.e2e.test.ts `
            test/e2e/access-relink-directory.test.ts `
            test/e2e/access-relink-directory-apply.test.ts `
            test/integration/form-ir-mutation-preservation.test.ts `
            test/integration/mcp-harness-process-tree.test.ts `
            test/integration/vba-manager-sentinel-trap.test.ts
          $vitestExit = $LASTEXITCODE
          node scripts/access-smoke-evidence.mjs $report
          $evidenceExit = $LASTEXITCODE
          if ($vitestExit -ne 0) { exit $vitestExit }
          if ($evidenceExit -ne 0) { exit $evidenceExit }
  ci-result:
    name: CI result
    if: always()
    needs: [changes, main-integrity, quality, windows-integration-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Validate routed jobs
        env:
          EVENT: ${{ github.event_name }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code_required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGRITY_RESULT: ${{ needs.main-integrity.result }}
          VALIDATED_PR_MERGE: ${{ needs.main-integrity.outputs.validated_pr_merge }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.windows-integration-smoke.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = success
          if test "$EVENT" = push; then
            test "$INTEGRITY_RESULT" = success
            test "$SMOKE_RESULT" = skipped
            if test "$VALIDATED_PR_MERGE" = true; then
              echo "validated PR merge: full quality already passed before merge"
              test "$QUALITY_RESULT" = skipped
            else
              echo "direct or unverifiable push: full quality required"
              test "$QUALITY_RESULT" = success
            fi
          else
            test "$INTEGRITY_RESULT" = skipped
            if test "$CODE_REQUIRED" = true; then
              test "$QUALITY_RESULT" = success
              test "$SMOKE_RESULT" = success
            else
              echo "docs-only: code quality jobs intentionally skipped"
              test "$QUALITY_RESULT" = skipped
              test "$SMOKE_RESULT" = skipped
            fi
          fi
