name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded pull-request run proves nothing: the commit it validated will
# never be merged. Cancelling it frees a Windows runner (billed at 2x) that
# would otherwise finish a ~13-minute gate nobody reads. Pushes to main are
# NOT cancelled — scripts/release-prepare.ps1 polls the CI conclusion for one
# specific release SHA and refuses to tag on anything but `success`, so a
# cancelled main run would abort a legitimate release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    # Pull requests exercise every Node major `engines.node` claims — a claimed
    # major that CI never runs is supported on paper only. A push to main
    # re-verifies the merged tree on the floor version alone, because the pull
    # request that produced that tree already proved the ceiling; re-running it
    # buys a second opinion on bytes that did not change.
    #
    # The ternary operates on the JSON *strings* and wraps the result in
    # fromJSON, so truthiness is decided on a non-empty string rather than on
    # an array. test/quality-gates/ci-workflow.test.ts derives both arms from
    # engines.node and fails when they disagree.
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[20, 26]' || '[20]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # The main-push receipt is authoritative and fail-closed. PRs already
        # exercise lint, tests, coverage and build; a warn-only audit there
        # consumed runner time without gating the change.
        if: github.event_name == 'push'
        env:
          AUDIT_SOURCE: https://registry.npmjs.org
          AUDIT_UNAVAILABLE_POLICY: fail
        run: node scripts/dependency-audit-evidence.mjs

      - name: Lint
        run: pnpm lint

      # `pnpm coverage` is `vitest run --coverage`: the same suite `pnpm test`
      # runs, plus instrumentation and the thresholds in vitest.config.ts. It
      # is a strict superset — if coverage passes, the tests passed. Running
      # both in one job spent ~650s where ~340s does the job, and the coverage
      # thresholds are Node-independent, so exactly one leg carries them.
      - name: Test
        if: matrix.node-version != 20
        run: pnpm test

      - name: Test with coverage
        if: matrix.node-version == 20
        run: pnpm coverage

      - name: Public test suite (#979)
        run: pnpm test:public

      - name: Build
        run: pnpm build

  windows-integration-smoke:
    name: Windows PowerShell/Access smoke
    # The PR proves these integration paths before merge. The main-push
    # quality receipt remains the exact-SHA authority used by releases.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows PowerShell host
        shell: pwsh
        run: |
          Get-Command powershell.exe
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run PowerShell Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -Scope CurrentUser
          }
          Import-Module Pester
          $result = Invoke-Pester -Path scripts/tests -PassThru -Output Minimal
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run Access/PowerShell integration tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-access-smoke-vitest.json"
          pnpm vitest run --config vitest.integration.config.ts --reporter=default --reporter=json --outputFile=$report test/e2e/access-fixture.e2e.test.ts test/e2e/access-relink-directory.test.ts test/e2e/access-relink-directory-apply.test.ts
          $vitestExit = $LASTEXITCODE
          node scripts/access-smoke-evidence.mjs $report
          $evidenceExit = $LASTEXITCODE
          if ($vitestExit -ne 0) { exit $vitestExit }
          if ($evidenceExit -ne 0) { exit $evidenceExit }
