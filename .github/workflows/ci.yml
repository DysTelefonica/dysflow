name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded pull-request run proves nothing: the commit it validated will
# never be merged. Cancelling it frees a Windows runner (billed at 2x) that
# would otherwise finish a ~13-minute gate nobody reads. Pushes to main are
# NOT cancelled — scripts/release-prepare.ps1 polls the CI conclusion for one
# specific release SHA and refuses to tag on anything but `success`, so a
# cancelled main run would abort a legitimate release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code_required: ${{ steps.classify.outputs.code_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/check-documentation-quality.mjs classify --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"
  quality:
    name: Quality gates
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest
    # One leg, because `engines.node` now claims one major. The two-leg matrix
    # existed to prove the floor and ceiling of a `>=20 <27` range. With the
    # range narrowed to Node 26, the second leg repeated deterministic work for
    # no extra signal (#1506).
    #
    # test/quality-gates/ci-workflow.test.ts derives this list from
    # engines.node, so widening support forces the matrix to widen with it.
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # The main-push receipt is authoritative and fail-closed. PRs already
        # exercise lint, tests, coverage and build; a warn-only audit there
        # consumed runner time without gating the change.
        if: github.event_name == 'push'
        env:
          AUDIT_SOURCE: https://registry.npmjs.org
          AUDIT_UNAVAILABLE_POLICY: fail
        run: node scripts/dependency-audit-evidence.mjs

      - name: Lint
        run: pnpm lint

      # Build once, and before anything reads `dist/`.
      #
      # The build used to run twice per leg: the root `prepare` lifecycle during
      # `pnpm install`, then this step (#1506 shows `tsc` at log lines 208 and
      # 984 of run 32597834437). `prepare` is the half that was removed, not
      # this step: pnpm skips lifecycle scripts when an install is a no-op, so
      # relying on it means the build can silently not happen — and
      # release-bundled-skills-1349 then fails with a bare ENOENT from its
      # unguarded `access(dist/cli/index.js)`. An explicit step ordered ahead of
      # its consumers cannot skip.
      - name: Build
        run: pnpm build

      # `pnpm coverage` is `vitest run --coverage`: the same suite `pnpm test`
      # runs, plus instrumentation and thresholds. Keep only the superset so
      # the suite runs exactly once per pull request (#1506).
      - name: Test with coverage
        run: pnpm coverage

      - name: Public test suite (#979)
        run: pnpm test:public

      - name: MCP context budget (shrink-only)
        run: pnpm mcp:context-budget

  windows-integration-smoke:
    name: Windows PowerShell/Access smoke
    needs: changes
    # The PR proves these integration paths before merge. The main-push
    # quality receipt remains the exact-SHA authority used by releases.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows PowerShell host
        shell: pwsh
        run: |
          Get-Command powershell.exe
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      # One explicit build, same reasoning as the quality job: the Pester and
      # Access steps below load the compiled core bridge, and `prepare` is no
      # longer there to build it implicitly (#1506).
      - name: Build TypeScript core bridge
        run: pnpm build

      - name: Run PowerShell Pester tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -Scope CurrentUser
          }
          Import-Module Pester
          $result = Invoke-Pester -Path scripts/tests -PassThru -Output Minimal
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run Access/PowerShell integration tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-access-smoke-vitest.json"
          pnpm vitest run --config vitest.integration.config.ts --reporter=default --reporter=json --outputFile=$report `
            test/e2e/access-fixture.e2e.test.ts `
            test/e2e/access-relink-directory.test.ts `
            test/e2e/access-relink-directory-apply.test.ts `
            test/integration/form-ir-mutation-preservation.test.ts `
            test/integration/mcp-harness-process-tree.test.ts `
            test/integration/vba-manager-sentinel-trap.test.ts
          $vitestExit = $LASTEXITCODE
          node scripts/access-smoke-evidence.mjs $report
          $evidenceExit = $LASTEXITCODE
          if ($vitestExit -ne 0) { exit $vitestExit }
          if ($evidenceExit -ne 0) { exit $evidenceExit }
  ci-result:
    name: CI result
    if: always()
    needs: [changes, quality, windows-integration-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Validate routed jobs
        env:
          EVENT: ${{ github.event_name }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code_required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.windows-integration-smoke.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = success
          if test "$EVENT" = push || test "$CODE_REQUIRED" = true; then
            test "$QUALITY_RESULT" = success
          else
            echo "docs-only: code quality jobs intentionally skipped"
            test "$QUALITY_RESULT" = skipped
          fi
          if test "$EVENT" = pull_request && test "$CODE_REQUIRED" = true; then
            test "$SMOKE_RESULT" = success
          else
            test "$SMOKE_RESULT" = skipped
          fi
