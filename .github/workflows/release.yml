name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_full_validation:
        description: Ignore a fresh CI receipt and run lint/tests again
        required: false
        type: boolean
        default: false

jobs:
  # This job is deliberately independent from release validation: it creates
  # the immutable, run-scoped build once while Windows validates the tag.
  build:
    name: Build release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    # Linux packaging job. Windows jobs stay on windows-latest for MS Access.
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      dist_sha256: ${{ steps.bundle.outputs.sha256 }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        run: node .github/scripts/set-release-package-version.mjs "${{ github.ref_name }}"

      - name: Build
        run: pnpm build

      # Tar before upload so executable modes and symlinks survive GitHub's ZIP
      # artifact transport. The digest also travels independently as a job output.
      - name: Bundle exact build output
        id: bundle
        run: |
          tar -cf dist-build.tar dist
          SHA256="$(sha256sum dist-build.tar | cut -d ' ' -f 1)"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload run-scoped build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.commit.outputs.sha }}
          path: dist-build.tar
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact identity
        run: echo "Uploaded dist-${{ steps.commit.outputs.sha }} with digest ${{ steps.upload.outputs.artifact-digest }}"

  # The product runtime is Windows-only. A recent successful main-push Quality
  # gates job for these exact bytes is accepted as its receipt; any uncertainty
  # (API errors included) falls through to the complete historical validation.
  release-validation:
    name: Windows release validation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `github.sha` can describe the pushed ref. Resolve the checked-out commit
      # so annotated tags are compared with the CI run's commit SHA.
      - name: Resolve tagged commit
        id: commit
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Verify CI receipt
        id: receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          FORCE_FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_validation && 'true' || 'false' }}
        run: node .github/scripts/verify-ci-receipt.mjs

      - name: Enable pnpm
        if: steps.receipt.outputs.decision != 'skip'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.receipt.outputs.decision != 'skip'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.receipt.outputs.decision != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.receipt.outputs.decision != 'skip'
        run: pnpm lint

      - name: Test
        if: steps.receipt.outputs.decision != 'skip'
        run: pnpm test

      - name: Receipt-skip summary
        if: steps.receipt.outputs.decision == 'skip'
        run: echo "Skipping lint+test for exact tag SHA ${{ github.sha }}; authoritative CI run ${{ steps.receipt.outputs.run_id }}, quality job ${{ steps.receipt.outputs.job_id }}."

  e2e-validation:
    name: E2E validation (Windows self-hosted)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # The full MCP end-to-end battery from `E2E_testing/` requires real
    # Microsoft Access (`NoConformidades.accdb`) and ACCESS_VBA_PASSWORD.
    # GitHub-hosted runners do not have Office; this job runs on a
    # self-hosted `dysflow-e2e` runner with Access pre-installed. The 20-minute
    # budget matches the README's "5-15 minutes" expected runtime with
    # headroom for sandbox provisioning.
    runs-on: dysflow-e2e
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Pre-stage E2E fixtures
        # The Access fixtures (NoConformidades.accdb, NoConformidades_Datos.accdb)
        # are .gitignored at .gitignore line 26, so a clean checkout never
        # includes them. They live on the self-hosted runner machine
        # (typically the same dev box the maintainer built them on) and
        # must be copied into the workspace before the harness runs. Set
        # the `DYSFLOW_FIXTURES_SOURCE` variable on the runner (or via
        # `vars.DYSFLOW_FIXTURES_SOURCE` in the GitHub UI) to override
        # the default `C:\00repos\codigo\dysflow\E2E_testing` lookup.
        shell: pwsh
        env:
          FIXTURES_SOURCE: ${{ vars.DYSFLOW_FIXTURES_SOURCE || 'C:\00repos\codigo\dysflow\E2E_testing' }}
        run: |
          $source = $env:FIXTURES_SOURCE
          $db1 = Join-Path $source 'NoConformidades.accdb'
          $db2 = Join-Path $source 'NoConformidades_Datos.accdb'
          if (-not (Test-Path -LiteralPath $db1)) {
            Write-Error "::error::E2E fixture not found: $db1. Pre-stage NoConformidades.accdb at the source path or set DYSFLOW_FIXTURES_SOURCE."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $db2)) {
            Write-Error "::error::E2E fixture not found: $db2. Pre-stage NoConformidades_Datos.accdb at the source path or set DYSFLOW_FIXTURES_SOURCE."
            exit 1
          }
          New-Item -ItemType Directory -Path 'E2E_testing' -Force | Out-Null
          Copy-Item -LiteralPath $db1 -Destination 'E2E_testing\NoConformidades.accdb' -Force
          Copy-Item -LiteralPath $db2 -Destination 'E2E_testing\NoConformidades_Datos.accdb' -Force
          Write-Host "Pre-staged E2E fixtures from $source"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        # `cache: pnpm` is intentionally OMITTED. We pin pnpm's virtual store
        # to the workspace (see "Install dependencies") which is incompatible
        # with setup-node's default cache lookup path; the post-run cache
        # save then fails with "Path Validation Error" and the job fails
        # despite the harness running green. For a self-hosted runner
        # the per-run pnpm cache buys nothing anyway — the persistent
        # setup-pnpm install keeps its own store across runs.
        with:
          node-version: 20

      - name: Install dependencies
        # pnpm/action-setup@v6 pins PNPM_HOME to its bundled pnpm install
        # (`~/setup-pnpm/` on Windows) and the virtual store lives next to it.
        # On a self-hosted Windows runner that store has been observed to
        # return ENOENT during copyfile from `files/<hash>` paths
        # (store content-addressed files missing), even though the
        # download phase reported success. Pinning `store-dir` to the
        # workspace gives pnpm a fresh, fast, local store that survives
        # the runner's setup-pnpm cache quirks.
        shell: pwsh
        run: |
          pnpm config set store-dir "$GITHUB_WORKSPACE/.pnpm-store"
          pnpm install --frozen-lockfile

      - name: Download exact-SHA build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.commit_sha }}
          path: .release-build

      - name: Extract build over the workspace
        # Default `run` shell on a self-hosted Windows runner is PowerShell 7.
        # Pin explicitly so future runner upgrades don't change semantics.
        # Windows ships `tar.exe` since 1809; `..` resolves to the workspace
        # root where the source checkout already lives.
        shell: pwsh
        working-directory: .release-build
        run: tar -xf dist-build.tar -C ..

      - name: Verify dist integrity
        shell: pwsh
        working-directory: .release-build
        env:
          EXPECTED_DIST_SHA256: ${{ needs.build.outputs.dist_sha256 }}
        run: |
          if (-not $env:EXPECTED_DIST_SHA256) {
            Write-Error "::error::EXPECTED_DIST_SHA256 not propagated from build job"
            exit 1
          }
          $actual = (Get-FileHash dist-build.tar -Algorithm SHA256).Hash.ToLower()
          $expected = $env:EXPECTED_DIST_SHA256.ToLower()
          if ($actual -ne $expected) {
            Write-Error "::error::SHA256 mismatch: expected=$expected actual=$actual"
            exit 1
          }
          Write-Host "dist-build.tar SHA256 verified: $actual"

      - name: Install throwaway test runtime (Windows)
        shell: pwsh
        # Per E2E_testing/README.md pre-release procedure:
        # `node dist/cli/index.js install --runtime-dir .\test-runtime --no-tui`.
        # `dist/cli/index.js` is the canonical CLI; `MCP_E2E_REFUSES_PRODUCTION_RUNTIME`
        # keeps the harness off %LOCALAPPDATA%\dysflow.
        run: node dist/cli/index.js install --runtime-dir .\\test-runtime --no-tui

      - name: Run full E2E battery
        shell: pwsh
        env:
          ACCESS_VBA_PASSWORD: ${{ secrets.ACCESS_VBA_PASSWORD }}
        # `pnpm test:e2e:mcp:release` refuses `--resume`; the release gate
        # cannot be satisfied with a replayed partial run. Sandbox is
        # auto-removed on success and preserved on failure under
        # %TEMP%\dysflow-mcp-e2e-* (the harness prints the path).
        run: pnpm test:e2e:mcp:release

  release:
    name: Build & Release Artifacts
    needs: [build, release-validation, e2e-validation]
    if: startsWith(github.ref, 'refs/tags/v')
    # Linux packaging job. Windows jobs stay on windows-latest for MS Access.
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    # Safe to expose: this is the boolean "is a signing key configured?", not the key
    # itself. Used to gate the signing step. The actual secret is only injected into the
    # signing step's own env, never into archive preparation.
    env:
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify checkout matches build input
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: test -n "$EXPECTED_COMMIT_SHA" && test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"

      - name: Stamp release version
        run: node .github/scripts/set-release-package-version.mjs "${{ github.ref_name }}"

      - name: Download exact-SHA build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.commit_sha }}
          path: .release-build

      - name: Verify and install build output
        env:
          EXPECTED_DIST_SHA256: ${{ needs.build.outputs.dist_sha256 }}
        run: |
          cd .release-build
          test -n "$EXPECTED_DIST_SHA256"
          echo "$EXPECTED_DIST_SHA256  dist-build.tar" | sha256sum --check -
          tar -xf dist-build.tar -C ..

      - name: Create release tarball
        # pnpm-lock.yaml is required so the self-updater can verify the
        # transitive dep graph with --frozen-lockfile (#666). The downloaded
        # dist tree is bound to this run and verified before entering the archive.
        # The archive helper fails closed before and after tar creation unless
        # all five canonical bundled skills are present (#1349).
        run: node .github/scripts/create-release-archive.mjs "dysflow-${{ github.ref_name }}.tar.gz"

      - name: Generate checksums
        run: sha256sum dysflow-*.tar.gz > SHA256SUMS

      - name: Require release signing key
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        run: |
          echo "RELEASE_SIGNING_KEY is required to publish signed Dysflow releases." >&2
          echo "Generate a keypair with .github/scripts/generate-release-signing-key.sh and store the private key as the GitHub Actions secret." >&2
          exit 1

      # Authenticity: sign SHA256SUMS with the Ed25519 release key and publish a
      # detached base64 signature (SHA256SUMS.sig). The self-updater verifies it
      # fail-closed against RELEASE_SIGNING_PUBLIC_KEY_PEM before trusting checksums.
      - name: Sign checksums (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          KEYFILE="$RUNNER_TEMP/release-signing.key"
          PUBFILE="$RUNNER_TEMP/release-signing.pub"
          RAWSIG="$RUNNER_TEMP/SHA256SUMS.sig.raw"
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$KEYFILE"
          openssl pkeyutl -sign -inkey "$KEYFILE" -rawin -in SHA256SUMS | base64 -w0 > SHA256SUMS.sig
          openssl pkey -in "$KEYFILE" -pubout -out "$PUBFILE"
          base64 -d SHA256SUMS.sig > "$RAWSIG"
          openssl pkeyutl -verify -pubin -inkey "$PUBFILE" -rawin -in SHA256SUMS -sigfile "$RAWSIG"
          rm -f "$KEYFILE" "$PUBFILE" "$RAWSIG"
          echo "Signed SHA256SUMS -> SHA256SUMS.sig"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # AGENTS.md hard rule: the release title MUST equal the tag name.
          name: ${{ github.ref_name }}
          files: |
            dysflow-*.tar.gz
            SHA256SUMS
            SHA256SUMS.sig
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # #668 protects the title invariant immediately after publication. Human
      # edits remain covered independently by release-title-guard.yml.
      - name: Assert release name == tag (#668)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_NAME="$(gh release view "${TAG}" --json name --jq .name)"
          if [ "${RELEASE_NAME}" != "${TAG}" ]; then
            echo "Release name must equal tag_name." >&2
            echo "  name    = ${RELEASE_NAME}" >&2
            echo "  tag     = ${TAG}" >&2
            exit 1
          fi
          echo "Release name matches tag: ${TAG}"
